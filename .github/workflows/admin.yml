name: Build Admin APK
on:
  push:
    branches: [ admin-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundLifeAdmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish admin APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SoundLifeAdmin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-latest
          name: SoundLife Admin (последняя сборка)
          files: SoundLifeAdmin.apk
          overwrite_files: true
          prerelease: true
