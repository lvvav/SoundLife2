name: Build S3 mini APK
on:
  push:
    branches: [ s3mini ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: s3mini
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundLife-S3mini-APK
          path: s3mini/app/build/outputs/apk/debug/app-debug.apk
