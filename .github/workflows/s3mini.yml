name: Build S3 mini APK
on:
  push:
    branches: [ s3mini ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: s3mini
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundLife-S3mini-APK
          path: s3mini/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s3mini-latest
          name: SoundLife для S3 mini (debug APK)
          files: |
            s3mini/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          prerelease: true
