name: Build S3 mini APK
on:
  push:
    branches: [ s3mini ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Скачать корневые сертификаты (для Android 4.1)
        run: |
          mkdir -p s3mini/app/src/main/assets/roots
          cd s3mini/app/src/main/assets/roots
          curl -fsSL -o digicert_g2.pem https://cacerts.digicert.com/DigiCertGlobalRootG2.crt.pem || echo "нет DigiCert G2"
          curl -fsSL -o digicert_ca.pem https://cacerts.digicert.com/DigiCertGlobalRootCA.crt.pem || echo "нет DigiCert CA"
          curl -fsSL -o digicert_ev.pem https://cacerts.digicert.com/DigiCertHighAssuranceEVRootCA.crt.pem || echo "нет DigiCert EV"
          curl -fsSL -o isrg_x1.pem https://letsencrypt.org/certs/isrgrootx1.pem || echo "нет ISRG X1"
          curl -fsSL -o gts_roots.pem https://pki.goog/roots.pem || echo "нет GTS"
          ls -l
      - name: Build Debug APK
        working-directory: s3mini
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundLife-S3mini-APK
          path: s3mini/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s3mini-latest
          name: SoundLife для S3 mini (debug APK)
          files: |
            s3mini/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          prerelease: true
