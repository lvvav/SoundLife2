name: Build APK
on:
  push:
    branches: [ main, upload/step25 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundLife2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Version info for in-app update
        if: github.ref_name == 'upload/step25'
        run: |
          VC=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$VC" "$VN" > version.json
          cat version.json
      - name: Publish release APK
        if: github.ref_name == 'upload/step25'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Последняя сборка (debug APK)
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          overwrite_files: true
          prerelease: true
