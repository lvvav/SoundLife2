plugins {
    id 'com.android.application'
}

android {
    namespace 'app.soundlife.s3'
    compileSdk 34

    defaultConfig {
        applicationId 'app.soundlife.s3'
        minSdk 16
        targetSdk 19
        versionCode 6
        versionName '0.7 s3'
        buildConfigField 'String', 'SUPA_URL', '"https://zpmzqgxwqoisfvahfhqc.supabase.co"'
        buildConfigField 'String', 'SUPA_KEY', '"sb_publishable_EJD_GXiloGMd6DDMt87G8Q_PxYmI8eF"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Современный TLS 1.2 для Android 4.1: системный стек старый и не договаривается с GitHub и Supabase
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
